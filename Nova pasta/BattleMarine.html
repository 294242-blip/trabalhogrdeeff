<script>
const $=s=>document.querySelector(s),N=5,LT='ABCDE',sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ===== Personagens (blocos 3D) ===== */

 pirata:{name:'Piratas',team:'#f87171',skin:'#d9a67a',suit:'#7f1d1d',hat:'#111827',hair:'#1f1f1f',beard:1},
 trovao:{name:'Almirante Trovão',team:'#fb923c',skin:'#e0ac82',suit:'#4b5563',hat:'#111827',hair:'#d1d5db',beard:1}};
function bx(w,h,d,col,x,y,z,c=''){return `<b class="bx ${c}" style="--w:${w}px;--h:${h}px;--d:${d}px;--c:${col};transform:translate3d(${x-w/2}px,${y-h/2}px,${z}px)"><i></i><i></i><i></i><i></i><i></i><i></i></b>`}
function fig(k){const c=CH[k];
 return bx(7,7,12,'#1f2937',-5,0,6)+bx(7,7,12,'#1f2937',5,0,6)+bx(18,10,16,c.suit,0,0,20)+bx(18,10,3,c.team,0,0,13)
 +bx(5,6,14,c.suit,-11,0,21)+bx(5,6,14,c.suit,11,2,21)+bx(14,14,14,c.skin,0,0,35)
 +(c.beard?bx(12,5,8,c.hair,0,6,31):bx(5,5,10,c.hair,0,-9,34))+bx(3,1,3,'#111',-3.5,7.5,36)+bx(3,1,3,'#111',3.5,7.5,36)
 +bx(15,15,4,c.hat,0,0,44)+bx(5,3,2,c.team,0,8,44)+bx(6,36,6,'#374151',11,12,26)+bx(8,6,8,c.team,11,31,26,'tip')}
const face=k=>{const c=CH[k];return `<div class="face" style="background:${c.skin}"><i style="background:${c.hair}"></i><u></u><u></u><s></s></div>`};
/* ===== Cenário: ilhas, navio e farol em blocos ===== */
const tree=(x,y,h)=>bx(5,5,h,'#7a4b25',x,y,12+h/2+2)+bx(16,16,12,'#2f9e44',x,y,14+h+4);
const isl=(w,t)=>bx(w,w*.7,10,'#8a6a45',0,0,5)+bx(w-4,w*.7-4,5,'#4caf50',0,0,12)+t.map(a=>tree(...a)).join('');
function deco(id,h,sc,rz){$('#'+id).innerHTML=`<div class="dw" style="transform:scale(${sc}) rotateX(72deg) rotateZ(${rz}deg)">${h}</div>`}
deco('dIsL',isl(110,[[-20,0,14],[10,10,10],[30,-8,16]]),1.6,-20);deco('dIsR',isl(100,[[-15,5,16],[15,-5,12]]),1.6,20);
deco('dShip',bx(120,30,10,'#9aa5b1',0,0,5)+bx(96,22,8,'#c3ccd6',0,0,14)+bx(44,16,12,'#8e99a6',-8,0,24)+bx(16,10,14,'#7b8794',-8,0,36)+bx(3,3,18,'#555',-8,0,52)+bx(16,6,6,'#555',34,0,20),1.3,-8);
deco('dLight',isl(70,[])+bx(16,16,10,'#fff',0,0,22)+bx(16,16,10,'#d33',0,0,32)+bx(16,16,10,'#fff',0,0,42)+bx(20,20,5,'#333',0,0,50)+bx(10,10,8,'#fde047',0,0,56)+bx(14,14,4,'#d33',0,0,62),1.5,10);
/* ===== Mapa ===== */
const FLEET=[{n:'Cruzador',l:3,c:'#4d6f99'},{n:'Submarino',l:2,c:'#37577f'},{n:'Lancha',l:2,c:'#a3b8cf'}],TOT=7;
const coord=(r,c)=>LT[c]+(r+1),inb=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
function newBoard(){const b={cells:Array.from({length:N},()=>Array(N).fill(-1)),shots:Array.from({length:N},()=>Array(N).fill(0)),ships:[]};
 FLEET.forEach((f,i)=>{for(;;){const h=Math.random()<.5,r=Math.random()*N|0,c=Math.random()*N|0,p=[];
  for(let k=0;k<f.l;k++)p.push(h?[r,c+k]:[r+k,c]);
  if(p.every(([y,x])=>inb(y,x)&&b.cells[y][x]<0)){p.forEach(([y,x])=>b.cells[y][x]=i);b.ships.push({...f,hit:0});break}}});return b}
const alive=b=>b.ships.reduce((a,s)=>a+s.l-s.hit,0),sunk=s=>s.hit===s.l;
/* ===== Disparos, pontuação e IA ===== */
function shoot(b,r,c){if(b.shots[r][c])return null;const i=b.cells[r][c];
 if(i<0){b.shots[r][c]=1;return{res:'miss'}}const s=b.ships[i];b.shots[r][c]=2;s.hit++;return{res:sunk(s)?'sunk':'hit',ship:s}}
function score(p,res){if(res==='miss'){p.st.miss++;p.streak=0;return 0}p.st.hit++;p.streak++;let n=100+(p.streak-1)*25;if(res==='sunk')n+=200;p.score+=n;return n}
const AI={q:[],lv:'hard',pick(b){const lv=this.lv,un=[],rnd=a=>a[Math.random()*a.length|0];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!b.shots[r][c])un.push([r,c]);
 if(lv==='easy')return rnd(un);
 if(lv==='mid'){let t;while(this.q.length){t=this.q.shift();if(!b.shots[t[0]][t[1]])return t}return rnd(un)}
 const w=Array.from({length:N},()=>Array(N).fill(0));
 b.ships.forEach(sp=>{if(sunk(sp))return;for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const hz of [0,1]){const cs=[];let ok=1,hits=0;
  for(let k=0;k<sp.l;k++){const y=hz?r:r+k,x=hz?c+k:c;if(!inb(y,x)){ok=0;break}const s=b.shots[y][x],i=b.cells[y][x];if(s==1||(s==2&&i>=0&&sunk(b.ships[i]))){ok=0;break}if(s==2)hits++;cs.push([y,x])}
  if(ok)cs.forEach(([y,x])=>{if(!b.shots[y][x])w[y][x]+=1+hits*12})}});
 let best=0,bl=[];un.forEach(([r,c])=>{if(w[r][c]>best){best=w[r][c];bl=[[r,c]]}else if(w[r][c]===best)bl.push([r,c])});return rnd(bl.length?bl:un)},
 feed(r,c,s){if(this.lv!=='mid')return;if(s==='sunk')this.q=[];else if(s==='hit')[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>inb(r+a,c+b)&&this.q.push([r+a,c+b]))}};
const LV={easy:{n:'Recruta',ch:'recruta'},mid:{n:'Piratas',ch:'pirata'},hard:{n:'Almirante Trov\u00e3o',ch:'trovao'}};
/* ===== Som ===== */
let mute=0,AC;function snd(a,b,d,t='sawtooth',v=.12){if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
/* ===== Partida e turnos ===== */
let G=null;
const mk=(ch,human,name)=>({ch,human,name,board:newBoard(),score:0,streak:0,st:{hit:0,miss:0},pos:[4,2],face:[-1,0],ang:180});
const turnMgr={shooter:()=>G.p[G.turn],defender:()=>G.p[1-G.turn],next(){if(G.mode!=='train')G.turn=1-G.turn}};
const say=t=>$('#msg').innerHTML=t,tgt=p=>[p.pos[0]+p.face[0]*2,p.pos[1]+p.face[1]*2];
function startMatch(mode,lv){lv=lv||'hard';const L=LV[lv];AI.lv=lv;AI.reset=0;AI.q=[];const pp=mode==='pvp';
 G={mode,lv,turn:0,busy:false,over:false,log:[],p:[mk('mare',true,pp?'Jogador 1':'Você'),mk(pp||mode==='train'?'trovao':L.ch,pp,pp?'Jogador 2':mode==='train'?'Alvo':L.n)]};
 ['#start','#end'].forEach(s=>$(s).classList.add('hide'));$('#ui').classList.remove('hide');
 $('#ui').classList.remove('placing');
 if(mode==='train')say('Treino: a frota aparece esmaecida. Mire e atire!');
 else{G.p[0].board=emptyBoard();if(pp)G.p[1].board=emptyBoard();G.place={i:0,sel:0,h:true,hold:false}}
 render()}
function setFace(p,a,b){const t={'1,0':0,'-1,0':180,'0,-1':90,'0,1':-90}[a+','+b];p.ang+=((t-p.ang+540)%360)-180;p.face=[a,b]}
function standFor(p,r,c){const [a,b]=tgt(p);if(a===r&&b===c)return;
 for(const [x,y] of [[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5))if(inb(r-x*2,c-y*2)){p.pos=[r-x*2,c-y*2];setFace(p,x,y);return}}
function move(d0,d1){if(!G||G.busy||G.over||G.place)return;const sh=turnMgr.shooter();if(!sh.human)return;setFace(sh,d0,d1);
 const y=sh.pos[0]+d0,x=sh.pos[1]+d1;if(inb(y,x))sh.pos=[y,x];render()}
function fireAim(){if(!G||G.busy||G.over||G.place)return;const sh=turnMgr.shooter();if(!sh.human)return;const [r,c]=tgt(sh);
 if(!inb(r,c))return say('Sem alvo à frente: mova-se ou vire o personagem.');
 if(turnMgr.defender().board.shots[r][c])return say(`Você já atirou em <b>${coord(r,c)}</b>. Escolha outra casa.`);fire(r,c)}
async function fire(r,c){
 if(G.busy||G.over)return;const sh=turnMgr.shooter(),df=turnMgr.defender();
 if(df.shield&&!df.board.shots[r][c]){df.shield=0;G.busy=true;say(`${sh.name} prepara a bazuca em <b>${coord(r,c)}</b>…`);standFor(sh,r,c);render();await sleep(500);snd(600,120,.35);await projectile(r,c);snd(900,300,.4,'triangle',.15);
  G.log.unshift(`${sh.name}: ${coord(r,c)} → 🛡️ bloqueado`);say(`🛡️ <b>${df.name}</b> bloqueou o tiro em ${coord(r,c)} com o escudo!`);render();await sleep(1100);turnMgr.next();G.busy=false;render();
  if(!turnMgr.shooter().human){await sleep(700);const [y,x]=AI.pick(turnMgr.defender().board);fire(y,x)}return}
 const res=shoot(df.board,r,c);if(!res)return;
 const extra=[];if(sh.arm==='multi'){sh.arm=null;addPw('multi',-1);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=r+a,x=c+b;if(inb(y,x)){const q=shoot(df.board,y,x);if(q)extra.push([y,x,q])}})}
 G.busy=true;say(`${sh.name} prepara a bazuca em <b>${coord(r,c)}</b>…`);standFor(sh,r,c);render();await sleep(500);
 snd(600,120,.35);await projectile(r,c);
 const hit=res.res!=='miss',pts=score(sh,res.res);splash(r,c,hit);snd(hit?160:300,hit?40:80,.5,hit?'square':'sine',hit?.2:.1);
 const txt=res.res==='sunk'?`💥 ${res.ship.n} afundado! +${pts}`:hit?`🔥 Acerto! +${pts}`:'💧 Água… errou.';
 G.log.unshift(`${sh.name}: ${coord(r,c)} → ${txt}`);say(`<b>${coord(r,c)}</b>: ${txt}`);
 if(extra.length){let ex=0;for(const [y,x,q] of extra){const h=q.res!=='miss';score(sh,q.res);splash(y,x,h);if(h)ex++}G.log.unshift(`${sh.name}: 💣 Multi Bomba → ${ex} acerto(s) extra`);say(`<b>${coord(r,c)}</b>: ${txt}<br>💣 Multi Bomba: ${ex} acerto(s) nas casas vizinhas!`);await sleep(700)}
 if(!sh.human||G.mode==='pvc'&&!sh.human)AI.feed(r,c,res.res);
 render();await sleep(900);
 if(alive(df.board)===0)return end(sh);
 turnMgr.next();G.busy=false;render();
 if(!turnMgr.shooter().human){await sleep(700);const [y,x]=AI.pick(turnMgr.defender().board);fire(y,x)}}
/* ===== Interface ===== */
function render(){
 const sh=turnMgr.shooter(),df=turnMgr.defender(),show=G.mode==='train'||(G.mode==='pvc'&&df.human),aimOn=sh.human&&!G.busy&&!G.over,[tr,tc]=tgt(sh);
 const card=(p,c)=>`<div class="hud ${c} ${p===sh?'on':''}">${face(p.ch)}<div><b>${p.name}</b><span>${p.score}</span><div class="hp"><i style="width:${alive(p.board)/TOT*100}%"></i></div></div></div>`;
 $('#hl').outerHTML=card(G.p[0],'l').replace('class="hud','id="hl" class="hud');$('#hr').outerHTML=card(G.p[1],'r').replace('class="hud','id="hr" class="hud');
 $('#av').style.display=G.place?'none':'';if(G.place)return renderPlace();
 let h='<div class="hd"></div>'+[...LT].map(l=>`<div class="hd">${l}</div>`).join('');
 for(let r=0;r<N;r++){h+=`<div class="hd">${r+1}</div>`;
  for(let c=0;c<N;c++){const i=df.board.cells[r][c],s=df.board.shots[r][c],sp=i>=0?df.board.ships[i]:null,vis=sp&&(show||sunk(sp)),aim=aimOn&&r===tr&&c===tc;
   h+=`<button class="cell ${vis?'sh':''} ${vis&&G.mode==='train'&&!s&&!sunk(sp)?'gh':''} ${s==2?'hit':s==1?'miss':''} ${aim?'aim':''}" style="${vis?`background:${s==2?'rgba(239,68,68,.7)':sp.c}`:''}" data-r="${r}" data-c="${c}" ${G.busy||G.over||s||!sh.human?'disabled':''} aria-label="${coord(r,c)}">${s==2?'<span class="mk">💥</span>':s==1?'•':''}${aim?'<b class="xh"></b>':''}</button>`}}
 $('#grid').innerHTML=h;drawShips(df.board,show);
 $('#hist').innerHTML=G.log.slice(0,5).map(l=>`<li>${l}</li>`).join('')||'<li>Nenhum disparo ainda.</li>';
 $('#fireB').disabled=!aimOn;
 const av=$('#av');if(av.dataset.k!==sh.ch){av.dataset.k=sh.ch;av.innerHTML=`<div class="fg">${fig(sh.ch)}</div>`}
 const cell=$(`[data-r="${sh.pos[0]}"][data-c="${sh.pos[1]}"]`),g=$('#grid'),k=cell.offsetWidth;$('#board').style.setProperty('--cw',k+'px');
 av.style.transform=`translate3d(${g.offsetLeft+cell.offsetLeft+k/2}px,${g.offsetTop+cell.offsetTop+cell.offsetHeight/2}px,3px) scale3d(${k/46},${k/46},${k/46})`;
 $('#av .fg').style.transform=`rotateZ(${sh.ang}deg)`}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.cell');if(b&&!b.disabled){if(G.place)return placeClick(+b.dataset.r,+b.dataset.c);standFor(turnMgr.shooter(),+b.dataset.r,+b.dataset.c);render()}});
/* ===== Animações ===== */
async function projectile(r,c){
 const s=($('#av .tip')||$('#board')).getBoundingClientRect(),t=$(`[data-r="${r}"][data-c="${c}"]`).getBoundingClientRect();
 const x0=s.left+s.width/2,y0=s.top+s.height/2,x1=t.left+t.width/2,y1=t.top+t.height/2,arc=Math.max(90,Math.abs(y1-y0)*.5);
 const p=document.createElement('div');p.className='fx';p.style.cssText='width:18px;height:18px;background:radial-gradient(#fff,#fde047 50%,#f97316);box-shadow:0 0 14px 6px rgba(253,224,71,.7)';document.body.appendChild(p);
 const kf=[];for(let i=0;i<=16;i++){const k=i/16;kf.push({transform:`translate(${x0+(x1-x0)*k-9}px,${y0+(y1-y0)*k-arc*4*k*(1-k)-9}px) scale(${1.2-.5*k})`})}

function splash(r,c,hit){bigBoom(r,c,hit);const t=$(`[data-r="${r}"][data-c="${c}"]`).getBoundingClientRect(),x=t.left+t.width/2,y=t.top+t.height/2,cols=['#22d3ee','#67e8f9','#0e7490','#fff',...(hit?['#fde047','#f472b6','#f97316']:[])];
 for(let i=0;i<(hit?24:14);i++){const d=document.createElement('div'),s=6+Math.random()*14,a=Math.random()*6.28,ds=30+Math.random()*(hit?80:55);
  d.className='fx';d.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${cols[i%cols.length]}`;document.body.appendChild(d);
  d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*ds}px,${Math.sin(a)*ds-30}px) scale(.2)`,opacity:0}],{duration:700,easing:'ease-out'}).finished.then(()=>d.remove())}
 const g=document.createElement('div');g.className='fx';g.style.cssText=`left:${x-10}px;top:${y-10}px;width:20px;height:20px;border:4px solid #67e8f9`;document.body.appendChild(g);g.animate([{transform:'scale(1)',opacity:1},{transform:'scale(4)',opacity:0}],{duration:600}).finished.then(()=>g.remove())}
/* ===== Vitória e derrota ===== */
function end(w){G.over=true;const lose=G.mode==='pvc'&&!w.human;

 $('#eP').innerHTML=G.p.map(p=>`<b>${p.name}</b>: ${p.score} pts (${p.st.hit} acertos, ${p.st.miss} erros)`).join('<br>');$('#end').classList.remove('hide');$('#eP').innerHTML+=saveRec(w)+earnCoins(w);render()}
/* ===== Posicionamento da frota ===== */
const emptyBoard=()=>({cells:Array.from({length:N},()=>Array(N).fill(-1)),shots:Array.from({length:N},()=>Array(N).fill(0)),ships:FLEET.map(f=>({...f,hit:0}))});
const placed=(b,k)=>b.cells.some(r=>r.includes(k)),shipCells=(P,b,r,c)=>Array.from({length:b.ships[P.sel].l},(_,k)=>P.h?[r,c+k]:[r+k,c]);
function placeClick(r,c){const P=G.place,b=G.p[P.i].board,i=b.cells[r][c];if(P.hold)return;

document.querySelectorAll('img.lg').forEach(i=>i.src=LOGO);document.querySelectorAll('img.coin').forEach(i=>i.src=COIN);
function getCoins(){try{return +localStorage.getItem('nbb_coins')||0}catch(e){return 0}}
function setCoins(n){try{localStorage.setItem('nbb_coins',n)}catch(e){}}
function getInv(){try{return JSON.parse(localStorage.getItem('nbb_inv'))||[]}catch(e){return[]}}
function coinHud(){document.querySelectorAll('.cn').forEach(e=>e.textContent=getCoins().toLocaleString('pt-BR'))}
function earnCoins(w){if(G.mode==='train')return '';const p=G.mode==='pvc'?G.p[0]:w,n=Math.round(p.score/10)+(p===w?25:5);setCoins(getCoins()+n);coinHud();return `<br>\ud83e\ude99 <b>+${n} moedas</b>`}
const SHOP=[{id:'multi',name:'Multi Bomba',icon:'💣',price:60,desc:'Atinge a casa mirada e as 4 vizinhas'},{id:'shield',name:'Escudo',icon:'🛡️',price:80,desc:'Bloqueia o próximo tiro inimigo'},{id:'radar',name:'Radar',icon:'📡',price:40,desc:'Revela uma casa com navio inimigo'}];
function renderShop(){const inv=getInv();$('#shopL').innerHTML=SHOP.length?SHOP.map(p=>`<div class="it"><span>${p.icon}</span><b>${p.name}</b><button data-b="${p.id}" ${inv.includes(p.id)?'disabled':''}>${inv.includes(p.id)?'Comprado':p.price+' moedas'}</button></div>`).join(''):'<p>Nenhum produto dispon\u00edvel ainda.<br>Jogue partidas para juntar moedas!</p>';coinHud()}
function renderInv(){const inv=getInv();$('#invL').innerHTML=inv.length?inv.map(id=>{const p=SHOP.find(x=>x.id===id);return `<div class="it"><span>${p?p.icon:'\ud83d\udce6'}</span><b>${p?p.name:id}</b></div>`}).join(''):'<p>Seu invent\u00e1rio est\u00e1 vazio.</p>'}
$('#shopL').onclick=e=>{const id=e.target.closest('[data-b]')?.dataset.b,p=SHOP.find(x=>x.id===id);if(!p||getInv().includes(id)||getCoins()<p.price)return;setCoins(getCoins()-p.price);try{localStorage.setItem('nbb_inv',JSON.stringify([...getInv(),id]))}catch(x){}renderShop()};
$('#shopB').onclick=()=>{renderShop();$('#shop').classList.remove('hide')};$('#invB').onclick=()=>{renderInv();$('#inv').classList.remove('hide')};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.add('hide'));
(function(){const sc=$('.scene'),isl=(l,w)=>{const d=document.createElement('div');d.className='isl';d.style.cssText=`left:${l}%;width:${w}vw`;d.innerHTML='<i class="rk"></i><i class="gr"></i><i class="tw"></i><i class="tw2"></i>'+Array.from({length:6},(_,i)=>`<i class="sd" style="left:${22+i*8}%"></i>`).join('');sc.appendChild(d)};isl(1,24);isl(38,26);isl(73,25)})();
coinHud();
function showDiff(){$('#modes').classList.add('hide');$('#diff').classList.remove('hide')}
$('#diffX').onclick=()=>{$('#diff').classList.add('hide');$('#modes').classList.remove('hide')};
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>startMatch('pvc',b.dataset.lv));
/* ===== Poderes: Multi Bomba, Escudo e Radar ===== */
function getPw(){try{return JSON.parse(localStorage.getItem('nbb_pw'))||{}}catch(e){return{}}}
function pwN(id){return getPw()[id]||0}
function addPw(id,n){const o=getPw();o[id]=Math.max(0,(o[id]||0)+n);try{localStorage.setItem('nbb_pw',JSON.stringify(o))}catch(e){}}
function renderShop(){$('#shopL').innerHTML=SHOP.map(p=>`<div class="it"><span>${p.icon}</span><div style="flex:1;text-align:left"><b>${p.name}</b> <small>(voc\u00ea tem ${pwN(p.id)})</small><br><small>${p.desc}</small></div><button data-b="${p.id}" ${getCoins()<p.price?'disabled':''}><img class="coin" src="${COIN}" alt=""> ${p.price}</button></div>`).join('');coinHud()}
function renderInv(){const l=SHOP.filter(p=>pwN(p.id)>0);$('#invL').innerHTML=l.length?l.map(p=>`<div class="it"><span>${p.icon}</span><div style="flex:1;text-align:left"><b>${p.name}</b><br><small>${p.desc}</small></div><b>x${pwN(p.id)}</b></div>`).join(''):'<p>Seu invent\u00e1rio est\u00e1 vazio. Compre poderes na loja!</p>'}
$('#shopL').onclick=e=>{const id=e.target.closest('[data-b]')?.dataset.b,p=SHOP.find(x=>x.id===id);if(!p||getCoins()<p.price)return;setCoins(getCoins()-p.price);addPw(id,1);renderShop()};
function pwRender(){const on=G&&!G.place&&!G.over&&G.mode!=='train',sh=on&&turnMgr.shooter();
 document.querySelectorAll('.pw').forEach(b=>{const id=b.dataset.pw;b.style.display=on?'':'none';if(!on)return;b.querySelector('b').textContent=pwN(id);
  const act=sh.arm===id||(id==='shield'&&!!sh.shield);b.disabled=!sh.human||G.busy||(id==='shield'&&!!sh.shield)||(!pwN(id)&&!act);b.classList.toggle('on',act)});
 document.querySelectorAll('.cell.ping').forEach(x=>x.classList.remove('ping'));
 if(on&&sh.human){const d=turnMgr.defender().board,p=d.ping;if(p&&!d.shots[p[0]][p[1]]){const el=$(`[data-r="${p[0]}"][data-c="${p[1]}"]`);el&&el.classList.add('ping')}}}
const _render=render;render=function(){_render();pwRender()};
document.querySelectorAll('.pw').forEach(b=>b.onclick=()=>{if(!G||G.busy||G.over||G.place)return;const sh=turnMgr.shooter(),id=b.dataset.pw;if(!sh.human)return;
